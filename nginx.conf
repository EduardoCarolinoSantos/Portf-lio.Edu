server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Não expor a versão do nginx
    server_tokens off;

    # Compressão de texto
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Headers de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; script-src 'self' 'unsafe-inline'; connect-src 'self' https://formspree.io; base-uri 'self'; frame-ancestors 'self'" always;

    # Cache longo para assets.
    # Usamos apenas 'expires' (que NÃO cancela os add_header herdados do server,
    # ao contrário de um add_header no location — pegadinha clássica do nginx).
    location ~* \.(?:css|js|png|jpe?g|svg|ico|woff2?)$ {
        expires 30d;
    }

    # HTML sempre revalidado
    location = /index.html {
        expires -1;
    }

    # Página de erro customizada
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
