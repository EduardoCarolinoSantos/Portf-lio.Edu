<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Página não encontrada</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%236c7bff'/><text x='32' y='45' font-family='monospace' font-size='30' font-weight='bold' text-anchor='middle' fill='%2306101a'>&lt;/&gt;</text></svg>"
        type="image/svg+xml" />
    <style>
        * { box-sizing: border-box }

        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 24px;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            color: #e9eef7;
            background:
                radial-gradient(1200px 500px at 100% 10%, rgba(108, 123, 255, .18), transparent 65%),
                linear-gradient(180deg, #06080f 0%, #0a0d13 100%);
        }

        code {
            font-size: clamp(72px, 18vw, 140px);
            font-weight: 800;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            background: linear-gradient(135deg, #6c7bff, #22d3ee);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
        }

        p { color: #9aa6b2; max-width: 46ch; margin: 12px auto 26px }

        a {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 999px;
            font-weight: 800;
            text-decoration: none;
            color: #06101a;
            background: linear-gradient(135deg, #6c7bff, #22d3ee);
            box-shadow: 0 12px 36px rgba(34, 211, 238, .25);
        }
    </style>
</head>

<body>
    <main>
        <code>404</code>
        <h1>Endpoint não encontrado</h1>
        <p>Essa rota não existe — mas o resto da API (e do portfólio) está no ar.</p>
        <a href="/">← Voltar ao início</a>
    </main>
</body>

</html>
